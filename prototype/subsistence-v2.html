<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151f19">
<title>살아있는 왕국 — 자급생활에서 문명으로</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;background:#101813;color:#f2e7ce}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #e2c178}
#app{max-width:1440px;margin:auto;display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:390px;background:#19261d}
header{flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 14px;background:#17251e;border-bottom:1px solid #465443}header h1{font-size:18px;letter-spacing:-.5px;margin:0;font-weight:900}header small{font-size:10px;color:#b5be9a;display:block;margin-top:2px}.time{font-size:12px;color:#ecdda5;text-align:right;font-weight:800;white-space:nowrap}.time small{color:#b7c4a5}
.kpis{flex:0 0 65px;display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:#405044;border-bottom:1px solid #475943}.kpi{min-width:0;background:#22342a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.kpi label{font-size:10px;color:#b9c9ad;white-space:nowrap}.kpi b{font-size:15px;color:#f4e7bd;white-space:nowrap}.danger{color:#ffad96!important}.good{color:#bfe4aa!important}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0;flex:1}.world{position:relative;min-height:0;background:#536848;overflow:hidden}canvas{width:100%;height:100%;image-rendering:pixelated;display:block;touch-action:manipulation}.scene-head{position:absolute;top:10px;left:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}.scene-head span{display:inline-block;font-size:11px;background:#162119de;padding:6px 9px;border-radius:6px;border:1px solid #899c7a88}.legend{position:absolute;bottom:9px;left:10px;right:10px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}.legend span{font-size:10px;padding:4px 7px;border:1px solid #6f8a68;background:#1c2d22e8;border-radius:5px}
.side{display:flex;flex-direction:column;min-height:0;background:#1b2b22;border-left:1px solid #50624d}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:9px;border-bottom:1px solid #405743}.tabs button{background:#293d30;color:#c6d5ba;border:1px solid #49624b;border-radius:7px;padding:8px 4px;font-size:12px;font-weight:750}.tabs button.active{color:#1b291e;background:#e0c18a;border-color:#e0c18a}.panel{min-height:0;flex:1;display:flex;flex-direction:column;padding:10px;gap:7px;overflow:hidden}.panel[hidden]{display:none}.panel h2{margin:0;font-size:14px;color:#e9d4a1}.summary{padding:9px;border:1px solid #465e49;background:#25382c;border-radius:8px;font-size:12px;line-height:1.5;color:#dae1ce}.rows{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:4px}.personrow{border:1px solid #425744;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:7px;background:#23372b;color:#e8e4cf;text-align:left;padding:7px 8px;min-height:37px}.personrow.active{background:#425540;border-color:#dec085}.personrow .person-name{font-weight:850;font-size:12px}.personrow small{font-size:10px;color:#b6c5ac}.personrow .status{font-size:10px;max-width:100px;text-align:right;color:#d2be90}.pager{display:flex;align-items:center;justify-content:space-between;gap:7px}.pager button{border:1px solid #668168;background:#324738;color:#ede4cd;border-radius:6px;padding:5px 10px;font-size:11px}.pager span{font-size:11px;color:#bbc8b4}.profile{border:1px solid #65725c;border-radius:8px;padding:10px;background:#2a3b30;flex:0 0 auto}.profile strong{font-size:14px}.profile small{display:block;margin-top:5px;color:#c2c6b0;font-size:11px;line-height:1.4}.profile .meter{height:6px;background:#122016;overflow:hidden;border-radius:6px;margin:6px 0}.profile .meter i{height:100%;display:block;background:#8bc18b}.events{min-height:0;overflow:hidden;flex:1;display:flex;flex-direction:column;gap:5px}.event{border-left:3px solid #acbb8f;padding:7px 8px;background:#26372a;border-radius:4px;font-size:11px;line-height:1.4}.event b{color:#dfca98;font-size:10px;display:block;margin-bottom:2px}.event.emergency{border-color:#db7a66}.event.success{border-color:#8db6a1}.facilities{display:grid;grid-template-columns:1fr 1fr;gap:7px}.facility{border:1px solid #405847;padding:8px;border-radius:7px;background:#273d30}.facility b{font-size:13px;color:#edddb6}.facility small{display:block;font-size:10px;color:#bbcab8;margin-top:4px}.helptext{font-size:11px;color:#b7c7b4;line-height:1.45}
footer{flex:0 0 56px;border-top:1px solid #405a46;background:#16251c;display:flex;align-items:center;gap:7px;padding:7px 12px}.ctl{border:1px solid #596f57;border-radius:7px;background:#2b4333;color:#ede9d3;font-size:11px;font-weight:750;padding:9px 12px;white-space:nowrap}.ctl.active{background:#d9ba7e;color:#1a271b}.grow{flex:1}footer .foot-note{font-size:10px;color:#abbfa7;white-space:nowrap}
@media(max-width:760px){header{flex-basis:50px;padding:6px 10px}header h1{font-size:15px}.time{font-size:11px}.kpis{flex-basis:59px}.kpi label{font-size:9px}.kpi b{font-size:12px}main{grid-template-columns:1fr;grid-template-rows:minmax(0,48%) minmax(0,52%)}.side{border-left:0;border-top:1px solid #50624d}.tabs{padding:5px 7px}.tabs button{padding:6px 3px;font-size:11px}.panel{padding:7px;gap:5px}.panel h2{font-size:12px}.rows{gap:3px}.personrow{padding:5px 7px;min-height:30px}.profile{padding:7px}.profile small{margin-top:2px}.summary{padding:7px;font-size:11px}.scene-head{top:5px;left:5px;gap:3px}.scene-head span{font-size:9px;padding:4px 5px}.legend{bottom:4px;left:5px;gap:3px}.legend span{font-size:9px;padding:3px 5px}footer{flex-basis:49px;padding:5px 7px;gap:4px}.ctl{font-size:10px;padding:7px 8px}.foot-note{display:none}}
@media(max-width:370px){.kpis{grid-template-columns:repeat(3,1fr);flex-basis:72px}.kpi{gap:1px}.kpi label{font-size:9px}.kpi b{font-size:12px}footer .ctl{padding:6px 5px}}
</style>
</head>
<body>
<div id="app">
<header><div><h1>살아있는 왕국 <span style="color:#dbc38e;font-size:11px">v2.0</span></h1><small>자급 · 수확 · 기술 · 건설 · 정치 — 주민들이 스스로 살아간다</small></div><div class="time"><span id="date">왕국력 1840년</span><small id="era">자급 생활기</small></div></header>
<section class="kpis"><div class="kpi"><label>주민</label><b id="pop">15명</b></div><div class="kpi"><label>식량 비축</label><b id="food">—</b></div><div class="kpi"><label>식량 여유</label><b id="daysFood">—일</b></div><div class="kpi"><label>목재 / 석재</label><b id="materials">—</b></div><div class="kpi"><label>불만</label><b id="unrest">—</b></div><div class="kpi"><label>마을 상태</label><b id="status">—</b></div></section>
<main><section class="world"><canvas id="world" aria-label="농사와 수렵채집을 하는 주민들의 자동 시뮬레이션 마을"></canvas><div class="scene-head"><span id="season">겨울</span><span id="fieldInfo">논밭</span><span id="stage">자급 공동체</span></div><div class="legend"><span id="visibleWorkers">농업</span><span id="visibleForagers">채집</span><span id="projectLine">건설 대기</span></div></section>
<aside class="side"><div class="tabs"><button id="tab-people" class="active">주민</button><button id="tab-news">역사</button><button id="tab-economy">생산·시설</button></div>
<div class="panel" id="peoplePanel"><div class="summary" id="leaderSummary">성주와 주민들이 생존을 준비하고 있습니다.</div><div class="rows" id="peopleList"></div><div class="pager"><button id="prev">이전</button><span id="page">1 / 3</span><button id="next">다음</button></div><div class="profile" id="profile"><strong>주민을 선택하세요</strong><small>직업, 성격, 나이와 선택 행동이 표시됩니다.</small></div></div>
<div class="panel" id="newsPanel" hidden><h2>왕국 연대기</h2><div class="events" id="news"></div><div class="summary" id="newsSummary"></div></div>
<div class="panel" id="ecoPanel" hidden><h2>자원과 문명 성장</h2><div class="summary" id="ecoSummary"></div><div class="facilities" id="facilities"></div><div class="summary" id="techSummary"></div><div class="helptext">식량 생산과 비축이 최우선입니다. 기술과 건축은 재료·노동력·목적이 있어야 진행되고, 상업은 충분한 잉여 생산이 생긴 뒤에야 시작됩니다.</div></div>
</aside></main>
<footer><button class="ctl active" id="pause">일시정지</button><button class="ctl" data-speed="1">1배속</button><button class="ctl" data-speed="6">6배속</button><button class="ctl" data-speed="24">24배속</button><button class="ctl" id="skip">+30일</button><span class="grow"></span><span class="foot-note">모든 주민은 자동 행동</span><button class="ctl" id="reset">새 왕국</button></footer>
</div>
<script>
(()=>{'use strict';
const el=id=>document.getElementById(id),canvas=el('world'),ctx=canvas.getContext('2d');
const labels={chief:'성주',advisor:'조언자',farmer:'농부',forager:'채집꾼',hunter:'사냥꾼',carpenter:'목수',guard:'경비병',labor:'노동자',merchant:'상인'};
const palette={chief:'#e3c777',advisor:'#c7a9dd',farmer:'#d5cd80',forager:'#82b6a0',hunter:'#bb8d76',carpenter:'#c0a286',guard:'#9fc3d8',labor:'#bdb49d',merchant:'#e3ae72'};
const names=['가렌','로완','엘라','브린','마르코','셀리','에드','레나','노아','티오','오토','헤나','로제','루크','칼','미라','리안','도라','베른','아샤','레오','유나','데릭','카일','보라','테오'];
let W=null,selection=null,tab='people',page=0,paused=false,speed=1,timer=null,lastStep=0,visualTime=0;
function seeded(n){return (n>>>0)||1234567}function rand(){let x=W.rng|0;x^=x<<13;x^=x>>>17;x^=x<<5;W.rng=x>>>0;return (W.rng>>>0)/4294967296}function chance(p){return rand()<Math.max(0,Math.min(1,p))}function ri(a,b){return Math.floor(a+rand()*(b-a+1))}function pick(a){return a[Math.floor(rand()*a.length)]}function clip(x,a,b){return Math.max(a,Math.min(b,x))}
function date(){const d=new Date(Date.UTC(1840,0,1)+(W.day-1)*86400000);return {year:d.getUTCFullYear(),month:d.getUTCMonth()+1,day:d.getUTCDate()}}
function season(){const m=date().month;return m<=2?'겨울':m<=5?'봄':m<=8?'여름':'가을'}
function profFactor(n){return n.age<20?.78:n.age<=40?1:n.age<60?1-(n.age-40)*.006:clip(.87-(n.age-60)*.023,.37,.87)}
function skill(n){return Math.round(n.skill*profFactor(n))}function cap(n){return clip(100-Math.max(0,n.age-40)*.6-Math.max(0,n.age-59)*1.15,30,100)}
function people(){return W.people.filter(p=>p.alive)}function chief(){return people().find(n=>n.role==='chief')||null}function count(role){return people().filter(n=>n.role===role).length}
function addEvent(message,kind='ordinary'){W.events.unshift({day:W.day,date:date(),message,kind});if(W.events.length>90)W.events.length=90}
function createPerson(role,migrant=false){let p={id:++W.nextId,name:pick(names)+' '+pick(['린','아','코','엘','베','르']),role,age:ri(role==='chief'?29:17,role==='chief'?63:66),birthdayMonth:ri(1,12),birthdayDay:ri(1,28),skill:ri(27,76),health:ri(72,100),energy:ri(55,100),hunger:ri(0,16),gold:0,personalFood:ri(0,2),foodDays:0,known:{},relations:{},goal:pick(['안전한 삶','가족과 친구','기술 익히기','부자 되기','권력 얻기','마을 지키기']),traits:{greed:ri(5,95),empathy:ri(5,95),fear:ri(5,95),ambition:ri(5,95),curiosity:ri(5,95),loyalty:ri(5,95)},alive:true,action:'생활',site:'home',fx:rand(),fy:rand(),yearWork:0,elderSavings:0};W.people.push(p);if(migrant){W.immigration++;addEvent(`${p.name}(${labels[role]})이 마을로 이주했다.`,'ordinary')}return p}
function generate(seed){W={seed:seeded(seed),rng:seeded(seed),day:1,nextId:0,stage:0,stageDays:0,folkLaw:'관습법',people:[],food:1450,foodCap:1900,wood:95,stone:28,tools:4,coin:0,treasuryGrain:0,morale:66,grievance:5,grievanceDays:0,foodShortageDays:0,tech:{farm:{lvl:0,points:0},craft:{lvl:0,points:0},trade:{lvl:0,points:0}},buildings:{homes:4,granary:1,irrigation:0,workshop:0,watch:1},project:null,crisis:null,localPolicy:'기초 곡물 보존',taxGrain:0,royalAid:0,unrest:0,uprisings:0,successfulUprisings:0,renovation:0,buildCompleted:0,researchUnlocked:0,yearsPassed:0,dead:0,immigration:0,emigration:0,sick:0,oldDeaths:0,starveDeaths:0,injuryDeaths:0,events:[],history:[],abandoned:false,ruinsDate:null,forest:100,cropLast:0,foragedLast:0,gameYear:1840};
for(const [role,number] of [['chief',1],['advisor',1],['farmer',6],['forager',3],['hunter',1],['carpenter',1],['guard',1],['labor',2]])for(let i=0;i<number;i++)createPerson(role);
for(const n of W.people){const zone=zones[chooseSite(n)]||zones.home;n.fx=zone[0]*900+((n.id*47)%101-50)*.65;n.fy=zone[1]*570+((n.id*67)%87-43)*.55}selection=W.people.find(n=>n.role==='farmer')?.id||W.people[0]?.id;page=0;paused=false;speed=1;W.rng=W.rng>>>0;addEvent('왕국력 1840년. 작은 토성 주변에 주민들이 농사·수렵·채집을 하며 살아간다.','success');addEvent('이 마을에는 아직 시장이나 화폐 경제가 없다. 식량 비축이 우선이다.');save();render();return W}
function find(id){return W.people.find(p=>p.id===id)}function friends(n){return people().filter(x=>x.id!==n.id&&(n.relations[x.id]||0)>42&&(x.relations[n.id]||0)>25)}function newBond(a,b,amt){a.relations[b.id]=clip((a.relations[b.id]||0)+amt,-100,100);b.relations[a.id]=clip((b.relations[a.id]||0)+amt*.85,-100,100)}
function chooseSite(n){if(n.role==='farmer')return 'fields';if(n.role==='forager')return 'forest';if(n.role==='hunter')return 'forest';if(n.role==='carpenter')return 'workshop';if(n.role==='guard')return 'watch';if(n.role==='chief'||n.role==='advisor')return 'castle';if(n.role==='merchant')return 'market';return W.project?'building':'forest'}
function ageResident(n){const d=date();if(n.birthdayMonth!==d.month||n.birthdayDay!==d.day)return;n.age++;n.energy=Math.min(n.energy,cap(n));if(n.age>=20&&n.age<=40){n.skill=clip(n.skill+(chance(.73)?1:0),20,96);if(n.age===20)addEvent(`${n.name}이 20세가 되어 본격적으로 일하기 시작했다.`,'ordinary')}else if(n.age>=60){n.skill=Math.max(12,n.skill-ri(0,n.age>=75?3:2));n.health=Math.min(n.health,clip(98-(n.age-60)*.75,43,98));if(n.age===60)addEvent(`${n.name}이 60세에 접어들어 중노동을 줄이고 경험을 나누기 시작했다.`,'ordinary')}
if(n.age>=60&&chance(n.age<70?.012:n.age<80?.045:n.age<90?.15:.36))die(n,'노환')}
function die(n,cause){if(!n.alive)return;n.alive=false;W.dead++;if(cause==='노환')W.oldDeaths++;else if(cause==='굶주림')W.starveDeaths++;else W.injuryDeaths++;n.action='사망';addEvent(`${n.name}(${labels[n.role]}, ${n.age}세)이 ${cause}으로 사망했다.`,'emergency');if(n.role==='chief')appointNewChief()}
function leave(n,why){if(!n.alive)return;n.alive=false;W.emigration++;n.action='이주';addEvent(`${n.name}이 ${why} 떠났다.`,'emergency');if(n.role==='chief')appointNewChief()}
function appointNewChief(){let eligible=people().filter(n=>n.age>=20);if(!eligible.length)return;const next=eligible.sort((a,b)=>(b.traits.ambition+b.skill+b.traits.loyalty)-(a.traits.ambition+a.skill+a.traits.loyalty))[0];next.role='chief';W.grievance=clip(W.grievance-9,0,100);addEvent(`${next.name}이 새 성주로 선출됐다.`,'success')}
function nextStage(){if(W.stage===0&&W.tech.farm.lvl>=1&&W.tech.craft.lvl>=1&&W.food>people().length*32){W.stage=1;const candidates=people().filter(n=>n.role==='labor'||n.role==='forager');if(candidates.length){const trade=([...candidates].sort((a,b)=>b.traits.ambition+b.traits.curiosity-a.traits.ambition-a.traits.curiosity))[0];trade.role='merchant';trade.goal='마을을 잇는 교역';addEvent(`${trade.name}이 교역상을 맡았다. 곡물과 도구를 물물교환하기 시작했다.`,'success')}addEvent('잉여 곡물과 도구가 늘어 정기적인 물물교환이 생겼다.','success')}if(W.stage===1&&W.tech.farm.lvl>=2&&W.tech.craft.lvl>=2&&W.buildings.workshop>=1&&W.tech.trade.lvl>=1&&(W.barterCount||0)>=8){W.stage=2;W.coin+=ri(25,55);addEvent('전문 공방과 교역이 자리를 잡았다. 작은 시장과 화폐 거래가 시작됐다.','success')}}
function research(kind,n,points){let t=W.tech[kind];if(t.lvl>=3)return;t.points+=points*(.55+skill(n)/100)*(.65+n.traits.curiosity/175);const threshold=kind==='farm'?5200+t.lvl*4200:kind==='craft'?950+t.lvl*1050:1100+t.lvl*1100;if(t.points>=threshold){t.points-=threshold;t.lvl++;W.researchUnlocked++;const title={farm:'농사법',craft:'수공업',trade:'교역 지식'}[kind];addEvent(`${n.name}의 시행착오가 쌓여 ${title} ${t.lvl}단계가 발전했다.`,'success')}nextStage()}
function gatherOutputs(n,s){if(n.energy<20||n.health<22){n.action='휴식·체력 회복';n.site='home';n.energy=Math.min(cap(n),n.energy+18);return}const eff=(.55+skill(n)/92)*(.5+n.energy/180);n.energy=Math.max(0,n.energy-(n.age>=60?23:17));n.site=chooseSite(n);n.yearWork++;
if(n.role==='farmer'){const base={겨울:0,봄:2.8,여름:4.6,가을:7.6}[s];const water=1+W.buildings.irrigation*.14;let crop=base*(1+W.tech.farm.lvl*.20)*water*eff*(W.crisis?.active?W.crisis.loss:1);const yieldAmt=Math.max(0,Math.round(crop));W.food+=yieldAmt;W.cropLast+=yieldAmt;n.action=s==='겨울'?'농기구 정비':'작물 재배';if(s==='겨울'){W.wood+=Math.round(1.2*eff)}research('farm',n,s==='겨울'?.40:2.2)}
else if(n.role==='forager'){const base={겨울:.5,봄:1.9,여름:3.7,가을:2.5}[s];const foraged=Math.max(0,Math.round(base*eff*(W.forest/100)));W.food+=foraged;W.foragedLast+=foraged;W.wood+=Math.round((s==='겨울'?1.3:2.2)*eff*(W.forest/100));W.forest=clip(W.forest-.055*eff,24,100);n.action=s==='겨울'?'땔나무 수집':'과일·나물 채집'}
else if(n.role==='hunter'){const hunted=Math.max(0,Math.round((s==='겨울'?3.5:2.6)*eff*(W.forest/100)));W.food+=hunted;W.foragedLast+=hunted;n.action='작은 짐승 사냥';W.forest=clip(W.forest-.07,25,100)}
else if(n.role==='carpenter'){if(W.wood>=5&&W.stone>=1&&W.tools<15){W.wood-=5;W.stone--;W.tools++;n.action='생활 도구 제작'}else{W.wood+=Math.max(0,Math.round(2.5*eff*(W.forest/100)));n.action='목재 가공'}research('craft',n,1.8);if(W.project)advanceProject(n,2*eff)}

function renderPeople(){const p=people(),size=Math.max(4,Math.min(8,window.innerHeight>850?7:5)),max=Math.max(1,Math.ceil(p.length/size));page=Math.min(page,max-1);el('leaderSummary').textContent=roleSummary();el('peopleList').replaceChildren();for(const n of p.slice(page*size,(page+1)*size)){const row=document.createElement('button');row.className='personrow'+(selection===n.id?' active':'');const left=document.createElement('span');const nm=document.createElement('span');nm.className='person-name';nm.textContent=n.name;const small=document.createElement('small');small.textContent=`${labels[n.role]} · ${n.age}세`;left.append(nm,small);const right=document.createElement('span');right.className='status';right.textContent=n.action;row.append(left,right);row.onclick=()=>{selection=n.id;renderPeople()};el('peopleList').append(row)}el('page').textContent=`${page+1} / ${max}`;const n=find(selection);if(n&&n.alive){el('profile').replaceChildren();const title=document.createElement('strong');title.textContent=`${n.name} · ${labels[n.role]}`;const small=document.createElement('small');small.textContent=`${n.age}세 · 건강 ${Math.round(n.health)} · 행동력 ${Math.round(n.energy)}/${Math.round(cap(n))} · 숙련 ${Math.round(n.skill)} · 목표 ${n.goal}. 현재 ${n.action}.`;const meter=document.createElement('div');meter.className='meter';const fill=document.createElement('i');fill.style.width=`${Math.max(0,Math.min(100,n.health))}%`;meter.append(fill);el('profile').append(title,meter,small)}}
function renderNews(){el('news').replaceChildren();for(const e of W.events.slice(0,window.innerHeight<750?5:9)){let node=document.createElement('div');node.className='event '+(e.kind==='emergency'?'emergency':e.kind==='success'?'success':'');let date=document.createElement('b');date.textContent=`${e.date.year}년 ${e.date.month}월 ${e.date.day}일`;let content=document.createElement('span');content.textContent=e.message;node.append(date,content);el('news').append(node)}el('newsSummary').textContent=`누적 사망 ${W.dead}명 · 이주 ${W.immigration}명 · 떠남 ${W.emigration}명 · 봉기 ${W.uprisings}회 · 건설 ${W.buildCompleted}개 · 연구 ${W.researchUnlocked}회`}
function renderEconomy(){el('ecoSummary').textContent=`생활 단계: ${['자급생활','물물교환','상업경제'][W.stage]}. 생산한 곡물과 산림 자원이 주민의 하루 생존과 시설 건설을 결정합니다. 국고 식량 ${Math.round(W.treasuryGrain)}자루 · 금화 ${Math.round(W.coin)}G`;
el('facilities').replaceChildren();const data=[['민가',W.buildings.homes+'동'],['곡물 창고',W.buildings.granary+'동'],['수로',W.buildings.irrigation+'곳'],['공방',W.buildings.workshop+'동'],['도구',Math.round(W.tools)+'개'],['목재 / 석재',Math.round(W.wood)+' / '+Math.round(W.stone)]];for(const [k,v] of data){const box=document.createElement('div');box.className='facility';const a=document.createElement('b');a.textContent=v;const b=document.createElement('small');b.textContent=k;box.append(a,b);el('facilities').append(box)}el('techSummary').textContent=`농사법 ${W.tech.farm.lvl}단계 · 수공업 ${W.tech.craft.lvl}단계 · 교역 지식 ${W.tech.trade.lvl}단계. 진행 건설: ${W.project?W.project.type+' '+Math.round(W.project.progress/W.project.needed*100)+'%':'없음'}.`}
function render(){const d=date();el('date').textContent=`왕국력 ${d.year}년 ${String(d.month).padStart(2,'0')}월 ${String(d.day).padStart(2,'0')}일`;el('era').textContent=['자급생활기','물물교환기','상업경제기'][W.stage];el('pop').textContent=people().length+'명';el('food').textContent=Math.round(W.food)+'자루';el('daysFood').textContent=(people().length?Math.floor(W.food/people().length):0)+'일';el('materials').textContent=Math.round(W.wood)+' / '+Math.round(W.stone);el('unrest').textContent=Math.round(W.grievance)+'/100';el('unrest').className=W.grievance>=65?'danger':'';el('status').textContent=W.abandoned?'멸망':W.state||'존속';el('status').className=W.abandoned||W.state==='몰락 위기'?'danger':W.state==='성장'?'good':'';el('season').textContent=season()+(W.crisis?.active?' · 대흉작':'');el('fieldInfo').textContent=`농사 ${W.cropLast} · 채집 ${W.foragedLast}`;el('stage').textContent=['농경·수렵채집','잉여 곡물 물물교환','시장과 상업'][W.stage];el('visibleWorkers').textContent=`농부 ${count('farmer')} · 사냥 ${count('hunter')}`;el('visibleForagers').textContent=`채집 ${count('forager')} · 성주정책 ${W.localPolicy}`;el('projectLine').textContent=W.project?'건축 '+Math.round(W.project.progress/W.project.needed*100)+'%':'주민 스스로 생활 중';
if(tab==='people')renderPeople();else if(tab==='news')renderNews();else renderEconomy();drawWorld()}
function switchTab(key){tab=key;for(const k of ['people','news','economy']){el(k+'Panel').hidden=k!==key;el('tab-'+k).classList.toggle('active',k===key)}render()}
function canvasClick(ev){const r=canvas.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*900,y=(ev.clientY-r.top)/r.height*570;let nearest=null,best=1e9;for(const n of people()){const dist=Math.hypot(n.fx-x,n.fy-y);if(dist<best){best=dist;nearest=n}}if(nearest&&best<45){selection=nearest.id;switchTab('people')}}
function setSpeed(v){speed=v;paused=false;el('pause').textContent='일시정지';el('pause').classList.remove('active');for(const b of document.querySelectorAll('[data-speed]'))b.classList.toggle('active',Number(b.dataset.speed)===v);startClock()}
function frame(){if(!W)return;visualTime++;drawWorld();requestAnimationFrame(frame)}
function startClock(){if(timer)clearInterval(timer);timer=setInterval(()=>{if(!paused&&!W.abandoned){const steps=speed>=24?2:1;for(let i=0;i<steps;i++)dailyStep();render()}},speed>=24?150:700/speed)}
function skipDays(days){if(!W)return;for(let i=0;i<days&&!W.abandoned;i++)dailyStep();save();render()}
el('tab-people').onclick=()=>switchTab('people');el('tab-news').onclick=()=>switchTab('news');el('tab-economy').onclick=()=>switchTab('economy');el('prev').onclick=()=>{page=Math.max(0,page-1);renderPeople()};el('next').onclick=()=>{page++;renderPeople()};el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'계속 진행':'일시정지';el('pause').classList.toggle('active',paused)};for(const b of document.querySelectorAll('[data-speed]'))b.onclick=()=>setSpeed(Number(b.dataset.speed));el('skip').onclick=()=>skipDays(30);el('reset').onclick=()=>{const proceed=confirm('기존 왕국을 초기화하고 새 자급생활 마을을 만들까요?');if(proceed){generate((Date.now()>>>0)^Math.floor(Math.random()*1e9));setSpeed(1);render()}};canvas.addEventListener('click',canvasClick);
if(!load())generate((Date.now()>>>0)^123127);render();setSpeed(1);requestAnimationFrame(frame);window.addEventListener('pagehide',save);window.addEventListener('resize',render);
window.__EVERWORLD__={step(n=1){for(let i=0;i<n&&!W.abandoned;i++)dailyStep();render();return snapshot()},snapshot,reset(seed=1840){generate(seed);return snapshot()},world:()=>W,pause(){paused=true},run(){paused=false},calendar:date};
})();
</script></body></html>
