</style></head><body><div id="app">

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), c=$('map'),ctx=c.getContext('2d',{alpha:false});
const cfg={w:960,h:600};const sites=[
{name:'왕궁',x:775,y:120,role:'castle'}, {name:'시장',x:465,y:290,role:'market'}, {name:'여관',x:215,y:165,role:'inn'}, {name:'초소',x:785,y:315,role:'guard'}, {name:'밭',x:150,y:445,role:'field'}, {name:'주택가',x:435,y:470,role:'home'}, {name:'대장간',x:690,y:470,role:'forge'}, {name:'숲길',x:100,y:95,role:'forest'}, {name:'제분소',x:570,y:137,role:'mill'}];
const names=['로빈','베르','엘라','라울','마르코','리나','아돌','라피','그레타','아샤','브론','에이미','로웬','티오','셀리','바론','루나','마틴','유나','프레드','레오','테스','카일','제인','베라','테오','오토','니나','루크','델라','이안','소라','가렌','노아','케일','도라','칼','메이','에드','로제'];
const roles=['농부','농부','농부','상인','상인','상인','치안대','치안대','치안대','광부','대장장이','여관주인','관리','하인','노동자','노동자','방랑자','방랑자','도적','도적','귀족','약초꾼','치료사','왕'];
const goals=['부자 되기','안전하게 살기','권력 얻기','가족 지키기','남을 돕기','복수하기','범죄로 돈 벌기','평범한 일상','명예 얻기','진실 밝히기'];
const worldNames=['새벽숲 왕국','칼렌 왕국','황금들판 왕국','회색산 왕국','달빛강 왕국'];
let W,selected=null,following=null,speed=1,paused=false,acc=0,lastFrame=0,canvasSize={w:0,h:0},view={scale:1,offX:0,offY:0};
function rng(n){return function(){n|=0;n=n+0x6D2B79F5|0;let t=Math.imul(n^n>>>15,1|n);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}};
function pick(a){return a[Math.floor(W.rand()*a.length)]}function rand(a,b){return a+W.rand()*(b-a)}function randint(a,b){return Math.floor(rand(a,b+1))}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function chance(p){return W.rand()<clamp(p,0,1)};
function traits(){const t={greed:randint(5,95),honesty:randint(5,95),fear:randint(5,95),ambition:randint(5,95),empathy:randint(5,95),suspicion:randint(5,95),aggression:randint(5,95),loyalty:randint(5,95),cunning:randint(5,95)};const shift=(W.culture-50)*.72;t.greed=clamp(t.greed+shift,3,98);t.honesty=clamp(t.honesty-shift,3,98);t.aggression=clamp(t.aggression+shift*.42,3,98);return t}
function placeFor(role){return({'왕':0,'귀족':0,'관리':0,'치안대':3,'농부':4,'상인':1,'노동자':5,'하인':5,'방랑자':2,'도적':7,'광부':6,'대장장이':6,'약초꾼':7,'여관주인':2,'치료사':5})[role]??5}
function makeNPC(role,immigrant=false){const id=++W.nextId;const start=placeFor(role),site=sites[start];const n={id,name:pick(names)+' '+['아','베','린','코','나','르'][randint(0,5)],role,goal:pick(goals),p:traits(),gold:randint(12,82),hp:randint(65,100),age:randint(19,60),hunger:randint(0,20),stress:randint(5,24),alive:true,jailed:0,loc:start,x:site.x+rand(-40,40),y:site.y+rand(-34,34),toX:site.x,toY:site.y,cooldown:randint(0,3),trust:{},known:{},victimCount:0,scamCount:0,kills:0,injuries:0,skill:randint(25,90),wealthPeak:0,bribe:0};
if(role==='왕'){n.gold=randint(220,500);n.goal=pick(['권력 얻기','안전하게 살기','명예 얻기']);n.hp=Math.max(n.hp,80)}
if(role==='도적'){n.gold=randint(5,45);n.goal=pick(['범죄로 돈 벌기','부자 되기','안전하게 살기'])}
W.people.push(n);if(immigrant){W.arrivals++;log('migration',`새 이주민 ${n.name}(${role})이(가) 도착했다.`,n.id)}return n}
function living(){return W.people.filter(n=>n.alive)}function byId(id){return W.people.find(n=>n.id===id)}function king(){return living().find(n=>n.role==='왕')}function howMany(role){return living().filter(n=>n.role===role).length}
function log(type,description,id){W.events.unshift({type,description,id,day:W.day,hour:W.hour});if(W.events.length>80)W.events.length=80;W.actionCounts[type]=(W.actionCounts[type]||0)+1;if(type==='political'||type==='violent')notify(description)}
function notify(msg){W.notice={text:msg,until:performance.now()+2600}}
function findNearby(n,filter=()=>true){const a=living().filter(x=>x.id!==n.id&&x.jailed===0&&x.loc===n.loc&&filter(x));a.sort((x,y)=>Math.hypot(n.x-x.x,n.y-x.y)-Math.hypot(n.x-y.x,n.y-y.y));return a.slice(0,7)}
function travel(n,loc){n.loc=loc;const p=sites[loc];n.toX=clamp(p.x+rand(-62,62),30,930);n.toY=clamp(p.y+rand(-50,50),34,565)}
function relation(a,b){return a.trust[b.id]||0}function shiftTrust(a,b,amount){a.trust[b.id]=clamp(relation(a,b)+amount,-100,100)}
function remember(n,other,kind,loss=0){if(!n.known[other.id])n.known[other.id]={fraud:0,theft:0,assault:0,help:0,resentment:0};const m=n.known[other.id];m[kind]=(m[kind]||0)+1;m.resentment+=loss;return m}
function lost(n,cause,from){if(!n.alive)return;n.alive=false;W.deaths++;n.hp=0;log('violent',`${n.name}(${n.role})이(가) ${cause} 사망했다.`,n.id);if(from){from.kills++;shiftTrust(n,from,-100)}if(n.role==='왕'){W.interregnum=true;W.emptyCrownDays=0}if(selected===n.id)notify('지켜보던 인물이 사망했습니다. 세계는 계속됩니다.')}
function defendChance(v,a){return clamp((v.p.suspicion+v.p.cunning-v.victimCount*0)/180 - a.p.cunning/260 + (v.known[a.id]?.fraud||0)*.32 + (v.known[a.id]?.theft||0)*.18 + (v.p.fear<25?-.03:.04),.06,.95)}
function scam(a,v){if(!v)return false;const familiar=v.known[a.id],deny=familiar&&familiar.fraud>=2;if(deny){if(chance(.38)){log('scam',`${v.name}: "또 나를 속이려고?" ${a.name}의 거래를 거절했다.`,v.id)}a.cooldown=randint(3,6);return false}
const amount=randint(3,20);if(v.gold<amount)return false;let success=chance(clamp(.42+(a.p.cunning-v.p.suspicion)/180+relation(v,a)/250-(familiar?.fraud||0)*.28,.07,.88));
if(success){a.gold+=amount;v.gold-=amount;a.scamCount++;v.victimCount++;let detected=chance(defendChance(v,a)+.19);if(detected){remember(v,a,'fraud',amount);shiftTrust(v,a,-randint(22,38));W.crimes++;log('scam',`${a.name}이(가) ${v.name}에게 ${amount}G 사기쳤다. 피해자가 알아챘다.`,a.id)}else{if(chance(.18))log('scam',`${a.name}이(가) ${amount}G를 챙겼다. ${v.name}은(는) 아직 모른다.`,a.id)}}else{remember(v,a,'fraud');shiftTrust(v,a,-12);if(chance(.4))log('scam',`${v.name}이(가) ${a.name}의 수상한 거래를 거절했다.`,v.id)}return success}
function steal(a,v){if(!v||v.gold<4)return false;let amount=Math.min(v.gold,randint(2,18));let p=clamp(.55+(a.p.cunning-v.p.suspicion)/210-(v.known[a.id]?.theft||0)*.23,.08,.85);if(chance(p)){a.gold+=amount;v.gold-=amount;v.victimCount++;W.crimes++;let caught=chance(clamp(.17+v.p.suspicion/210+W.order/260,.1,.78));if(caught){remember(v,a,'theft',amount);shiftTrust(v,a,-32);log('scam',`${a.name}이(가) ${v.name}의 금화 ${amount}G를 훔쳤다.`,a.id)}else if(chance(.15))log('scam',`${v.name}의 돈이 사라졌다. 범인은 밝혀지지 않았다.`,v.id);return true}else{if(chance(.15)){remember(v,a,'theft');log('scam',`${v.name}이(가) ${a.name}의 손을 붙잡았다. 절도 미수.`,v.id)}return false}}
function assault(a,v){if(!v)return;let power=17+a.skill*.38+a.p.aggression*.15+rand(0,24);let shield=14+v.skill*.37+v.p.fear*.07+rand(0,24);if(power>shield){let dmg=randint(14,46);v.hp-=dmg;a.hp-=randint(0,12);v.injuries++;W.crimes++;shiftTrust(v,a,-55);remember(v,a,'assault',dmg);log('violent',`${a.name}이(가) ${v.name}을(를) 공격했다. 피해 ${dmg}.`,a.id);if(v.hp<=0)lost(v,'싸움으로',a)}else{a.hp-=randint(7,28);log('violent',`${v.name}이(가) ${a.name}의 공격을 막아냈다.`,v.id);if(a.hp<=0)lost(a,'반격을 당해',v)}}
function guardAction(n){const nearby=findNearby(n,x=>Object.values(x.known||{}).length>=0).slice(0,5);const criminals=nearby.filter(x=>x.role==='도적'||x.scamCount>2||x.kills>0);const target=criminals[0];if(target&&chance(.21+(n.p.honesty/320))){if(n.skill+rand(0,60)>target.skill+rand(0,60)){let fine=Math.min(target.gold,randint(3,22));n.gold+=Math.floor(fine*.25);W.treasury+=fine-Math.floor(fine*.25);target.gold-=fine;target.jailed=randint(6,28);shiftTrust(target,n,-22);log('justice',`${n.name}이(가) ${target.name}을(를) 체포했다.`,n.id)}else if(chance(.25)){assault(target,n)}}else if(chance(.1)&&n.p.honesty<40){const p=pick(nearby);if(p&&p.gold>12){p.gold-=8;n.gold+=8;W.crimes++;log('scam',`${n.name} 치안대가 주민에게 뇌물을 받았다.`,n.id)}}}

}
function updateUI(){let alive=living();$('mDay').textContent=`${W.day}일 ${String(W.hour).padStart(2,'0')}시`;$('mPop').textContent=alive.length+'명';$('mKing').textContent=king()?.name.split(' ')[0]||'공석';$('mDeaths').textContent=`${W.deaths} / ${W.arrivals}`;$('mOrder').textContent=W.order>70?'안정':W.order>43?'보통':'혼란';$('worldName').textContent=W.name;$('worldName').nextElementSibling.textContent=W.culture>68?'탐욕과 사기가 만연한 사회':W.culture<32?'정직과 신뢰를 중시하는 사회':'인물마다 다른 욕망이 충돌하는 사회';$('season').textContent=paused?'시뮬레이션 정지':`${speed}배속 · 자율 시뮬레이션`;$('liveText').textContent=paused?'일시 정지':'자동 진행 중';$('liveDot').classList.toggle('off',paused);$('status').textContent=following?`추적: ${byId(following)?.name||'종료'}`:'관찰자 · 개입 필요 없음';const list=$('eventList');list.replaceChildren();for(const e of W.events.slice(0,3)){let div=document.createElement('div');div.className='event '+e.type;let sym=document.createElement('span');sym.className='symbol';sym.textContent=({violent:'×',political:'♛',scam:'?',migration:'+',justice:'!',trade:'◈',world:'•'})[e.type]||'•';let t=document.createElement('div');t.className='et';t.textContent=e.description;let small=document.createElement('small');small.textContent=`${e.day}일 ${String(e.hour).padStart(2,'0')}시`;t.append(small);div.append(sym,t);div.addEventListener('click',()=>{if(e.id)selectNPC(e.id)});list.append(div)}if(selected)updatePanel()}
function updatePanel(){let n=byId(selected);if(!n)return;let personality=Object.entries(n.p).sort((a,b)=>b[1]-a[1]);const traitLabels={greed:'탐욕',honesty:'정직',fear:'겁',ambition:'야망',empathy:'공감',suspicion:'의심',aggression:'공격성',loyalty:'충성',cunning:'교활함'};$('pName').textContent=n.name+(n.alive?'':' (사망)');$('pRole').textContent=`${n.role} · ${n.age}세 · 소지금 ${n.gold}G · 체력 ${Math.max(0,Math.round(n.hp))}`;$('pTags').replaceChildren();for(const item of [`목표: ${n.goal}`, ...personality.slice(0,3).map(([k,v])=>traitLabels[k]+' '+Math.round(v))]){let s=document.createElement('span');s.className='tag';s.textContent=item;$('pTags').append(s)}$('pDesc').textContent=`사기 ${n.scamCount}회 · 피해 ${n.victimCount}회 · 살해 ${n.kills}명 · 스트레스 ${Math.round(n.stress)}. 현재 ${sites[n.loc].name} 주변에서 생활한다.`;let entries=Object.entries(n.known).filter(([,mem])=>mem.fraud||mem.theft||mem.assault).slice(0,3);$('pMemory').textContent=entries.length?`기억: ${entries.map(([id,m])=>{let x=byId(+id);return `${x?.name||'누군가'}에게 ${m.fraud?'사기 '+m.fraud+'회':m.theft?'도난 '+m.theft+'회':'공격 '+m.assault+'회'} 경험`}).join(' / ')}`:'피해 경험이 알려진 상대는 아직 없다.';$('pFollow').textContent=following===n.id?'추적 해제':'이 사람 추적';}
function selectNPC(id){let n=byId(id);if(!n)return;selected=id;$('panel').classList.add('open');updatePanel()}
function screenToWorld(px,py){let r=c.getBoundingClientRect();return{x:(px-r.left)/r.width*960,y:(py-r.top)/r.height*600}}
function clicked(e){const p=screenToWorld(e.clientX,e.clientY);let best=null,d=9999;for(const n of living()){const dist=Math.hypot(n.x-p.x,n.y-p.y);if(dist<d){d=dist;best=n}}if(best&&d<55)selectNPC(best.id);else{$('panel').classList.remove('open');selected=null}}
function animate(now){if(!lastFrame)lastFrame=now;const dt=clamp(now-lastFrame,0,150);lastFrame=now;if(!paused){acc+=dt*speed;let loops=0;while(acc>=600&&loops<20){tick();acc-=600;loops++}if(loops)updateUI()}if(W.notice&&now<W.notice.until){$('toast').textContent=W.notice.text;$('toast').classList.add('show')}else{$('toast').classList.remove('show')}renderWorld();requestAnimationFrame(animate)}
function newWorld(){const seed=(Math.floor(Math.random()*0xFFFFFFFF))>>>0;createWorld(seed);saveWorld();notify('새 왕국이 생성되었습니다. 모든 주민이 자율적으로 살아갑니다.')}
c.addEventListener('click',clicked);$('pClose').onclick=()=>{$('panel').classList.remove('open');selected=null};$('pFollow').onclick=()=>{following=following===selected?null:selected;updatePanel();updateUI()};$('pauseBtn').onclick=()=>{paused=!paused;$('pauseBtn').textContent=paused?'계속 진행':'일시정지';updateUI()};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b));updateUI()});$('newWorld').onclick=newWorld;
if(!loadWorld())createWorld((Date.now()>>>0)+32719);window.addEventListener('pagehide',saveWorld);requestAnimationFrame(animate);
window.__EVERWORLD__={getState:()=>({culture:W.culture,day:W.day,hour:W.hour,pop:living().length,total:W.people.length,deaths:W.deaths,arrivals:W.arrivals,crowns:W.crowns,foreignChanges:W.foreignChanges,king:king()?.id||null,events:W.events.length,counts:{...W.actionCounts},money:living().reduce((s,n)=>s+n.gold,0),seed:W.seed}),advance:(hours)=>{for(let i=0;i<hours;i++)tick();updateUI();return window.__EVERWORLD__.getState()},reset:(seed)=>createWorld(seed),getNPCs:()=>W.people.map(n=>({id:n.id,role:n.role,goal:n.goal,alive:n.alive,known:n.known,gold:n.gold,x:n.x,y:n.y,trust:n.trust})),pause:()=>{paused=true;updateUI()}};
})();
</script></body></html>
