function noticeFraud(v,a,loss){const m=v.mem; m.scamLoss+=loss; m.distrust=clamp(m.distrust+roll(2,8)+(loss>15?3:0),0,100); if(a&&rng()<(v.traits.wary*.006+.25)){m.known[a.id]=(m.known[a.id]||0)+1;changeRel(v,a,-roll(10,25));}if(m.scamLoss>75&&v.traits.wary<88&&rng()<.24){v.traits.wary+=roll(1,4);addLog(`${v.name}은(는) 반복된 피해로 훨씬 조심스러워졌다.`)}}

function kingSuccession(){const a=active().filter(n=>n!==player);const candidates=a.filter(n=>['재상','경비병','상인','용병'].includes(n.role)).sort((x,y)=>(y.traits.ambitious+y.gold*.15)-(x.traits.ambitious+x.gold*.15));if(candidates.length&&rng()<.78){const n=candidates[0],old=n.role;n.role='왕';world.king=n.id;n.goal='왕좌 유지';world.stability=clamp(world.stability+roll(15,30),0,100);addLog(`${n.name}(${old})이(가) 새 국왕이 됐다.`,true);incident('새 왕 즉위',`${n.name}이(가) 왕좌에 올랐습니다.`,n);bubble(n,'이제 내가 왕이다!')}else{world.stability=25;addLog('옆 나라 국왕이 왕국을 접수했다.',true);const foreign=createNpc('왕',world.npcs.length);foreign.name='타국의 '+foreign.name;world.npcs.push(foreign);world.king=foreign.id;incident('외국 왕의 통치','왕국이 다른 나라에 병합됐습니다.',foreign)}}

function renderDeath(){const pool=active().filter(n=>n!==player).sort((a,b)=>b.hp-a.hp);const picks=[...pool].sort(()=>rng()-.5).slice(0,3);const life=lifeN;showModal('당신은 죽었습니다',`<p>제${life}번째 인생은 ${world.day}일째 끝났습니다. 그러나 왕국은 계속 살아갑니다.</p><p class="muted">총 사망 ${world.deaths}명 · 이주 ${world.migrants}명 · 범죄 ${world.crimes}건</p><p class="legend">같은 세계의 다른 주민으로 이어서 살아가세요.</p>`,picks.map(n=>({label:`${emojis[n.role]||'👤'} ${n.name} · ${n.role} · 생명 ${n.hp} · ${n.gold}G`,action:()=>takeover(n)})).concat({label:'완전히 새로운 세계 만들기',action:()=>{hideModal();genWorld((Date.now()+worldN*271)>>>0)}}));}
function takeover(n){hideModal();player=n;player.mem.known||={};lifeN++;selected=active().find(x=>x!==player)||null;nav=null;queued=null;paused=false;cam.x=n.x;cam.y=n.y;bubble(n,'이번에는 내가 주인공이다.');addLog(`${n.name}(${n.role})의 삶을 이어받았습니다.`,true);refresh()}
function showModal(title,html,btns){paused=true;const e=$('overlay');e.classList.remove('gone');e.innerHTML=`<div class="modal" role="dialog"><h2>${esc(title)}</h2>${html}<div id="modalbuttons"></div></div>`;const c=$('modalbuttons');for(const b of btns){const x=document.createElement('button');x.textContent=b.label;x.onclick=b.action;c.appendChild(x)}}
function hideModal(){const e=$('overlay');e.classList.add('gone');e.innerHTML='';}
function inspect(){const list=world.history.slice(0,20).map(x=>`<p style="margin:6px 0"><span class="muted">${x.day}일 </span>${esc(x.s)}</p>`).join('');showModal('세계 연대기',`<div style="max-height:45vh;overflow:auto">${list||'아직 아무 일도 일어나지 않았습니다.'}</div>`,[{label:'돌아가기',action:()=>{hideModal();paused=false;refresh()}}])}
function help(){showModal('어떻게 살아남을까?',`<p>화면을 클릭해 이동하고, 움직이는 주민을 선택하세요. <span class="legend">키보드 WASD 또는 방향키</span>로도 이동할 수 있습니다.</p><p>상대의 성격과 목표는 숨겨져 있습니다. 말로 알아낸 뒤 사기를 치거나 거래하세요. 여러 번 당한 주민은 당신을 기억합니다.</p><p>당신이 쉬는 동안에도 주민들은 서로 일하고, 속이고, 공격합니다. 죽으면 같은 왕국의 다른 사람으로 이어갑니다.</p><p>매일 굶주림에 주의하세요. <span class="legend">거래하기로 식량</span>을 마련할 수 있습니다.</p>`,[{label:'마을로 돌아가기',action:()=>{hideModal();paused=false}}])}
function refresh(){if(!world||!player)return;const n=selected&&selected.alive?selected:null;$('clock').textContent=`${world.day}일째 ${String(8+Math.floor((world.tick%48)*.5)%24).padStart(2,'0')}:${(world.tick%2?'30':'00')}`;$('population').textContent=`주민 ${active().length}명`;$('speedValue').textContent=speed+'×';$('myRole').textContent=`${player.role} · ${lifeN}번째 인생 · 식량 ${Math.max(0,player.food)}일`;$('myName').textContent=player.name;$('meFace').textContent=emojis[player.role]||'👤';$('hp').style.width=clamp(player.hp,0,100)+'%';$('money').textContent=player.gold+' G';$('place').textContent=where(player.x,player.y);if(n){$('targetFace').textContent=emojis[n.role]||'👤';$('targetLabel').textContent=`${n.role} · ${n.goal}`;$('targetName').textContent=n.name;$('rangeHint').textContent=dist(player,n)<65?'바로 상호작용':'누르면 자동 접근';if($('targetDesc').dataset.target!==''+n.id){$('targetDesc').textContent=describe(n);$('targetDesc').dataset.target=n.id}}else{$('targetFace').textContent='👤';$('targetLabel').textContent='마주한 인물';$('targetName').textContent='주민을 선택하세요';$('rangeHint').textContent='NPC를 클릭하세요';$('targetDesc').textContent='움직이는 주민을 클릭해보세요.';$('targetDesc').dataset.target=''} $('pause').textContent=paused?'▶ 재개':'⏸ 멈춤';$('speed').textContent=speed===1?'⏩ 3배속':'⏭ 1배속'}
function describe(n){const known=player.mem.known[n.id]||0;if(!known)return `${n.role} · 성격은 아직 알 수 없습니다.`;const t=n.traits;return `${t.greed>70?'돈을 무척 밝힘':t.honest>70?'정직해 보임':t.brave<30?'겁이 많아 보임':t.wary>65?'쉽게 믿지 않음':'속을 알기 어려움'} · ${known>=2?'당신을 '+(relation(n,player)<-15?'경계함':'알아봄'):'첫인상'}`}
function select(n){if(n===player||!n.alive)return;selected=n;$('targetDesc').dataset.target='';refresh();bubble(n,pick(['뭘 보시오?','무슨 일입니까?','지금 바쁜데.','무슨 용건이죠?']),1300)}
function npcMove(dt){for(const n of active()){if(n===player)continue;if(Math.abs(n.tx)<.01&&Math.abs(n.ty)<.01)continue;const dx=n.tx-n.x,dy=n.ty-n.y,d=Math.hypot(dx,dy);if(d<3){n.tx=0;n.ty=0;continue}const v=Math.min(d,dt*(n.role==='도적'?64:53));n.x+=dx/d*v;n.y+=dy/d*v;n.face=dx>1?1:dx< -1?3:n.face;}}
function playerMove(dt){if(!player.alive)return;let dx=0,dy=0;const ks=keys;if(ks.has('ArrowLeft')||ks.has('a'))dx--;if(ks.has('ArrowRight')||ks.has('d'))dx++;if(ks.has('ArrowUp')||ks.has('w'))dy--;if(ks.has('ArrowDown')||ks.has('s'))dy++;if(dx||dy){nav=null;queued=null;const l=Math.hypot(dx,dy);player.x=clamp(player.x+dx/l*130*dt,23,W-23);player.y=clamp(player.y+dy/l*130*dt,105,H-21);player.face=dx>0?1:dx<0?3:player.face}else if(nav){let tx=nav.x,ty=nav.y;const other=nav.targetId&&targetById(nav.targetId);if(other){tx=other.x;ty=other.y}if(tx!=null){const d=Math.hypot(tx-player.x,ty-player.y),stop=other?46:5;if(d<=stop){const doneNav=nav;nav=null;if(doneNav.bag&&doneNav.bag.money>0){const loot=doneNav.bag.money;player.gold+=loot;doneNav.bag.money=0;spark(player.x,player.y,'+'+loot+'G');addLog(`${loot}G가 든 돈주머니를 주웠습니다.`);refresh()}if(queued){const next=queued;queued=null;const npc=targetById(next.targetId);if(npc)perform(next.act,npc)}}else{const step=Math.min(d-stop,130*dt);player.x+=(tx-player.x)/d*step;player.y+=(ty-player.y)/d*step;player.face=tx>player.x?1:3}}}}
function resize(){const r=$('world').getBoundingClientRect();sw=Math.max(150,r.width);sh=Math.max(140,r.height);px=Math.min(devicePixelRatio||1,2);cvs.width=Math.round(sw*px);cvs.height=Math.round(sh*px);cvs.style.width=sw+'px';cvs.style.height=sh+'px';}
function calcCamera(){scale=Math.max(sw/W,sh/H);const vw=sw/scale,vh=sh/scale;const follow=(sw<650||sh<460);const cx=follow?player.x:W/2,cy=follow?player.y:H/2;cam.x=clamp(cx,vw/2,W-vw/2);cam.y=clamp(cy,vh/2,H-vh/2)}
function getWorldPos(e){const r=cvs.getBoundingClientRect(),xx=(e.clientX-r.left)/scale+cam.x-sw/(2*scale),yy=(e.clientY-r.top)/scale+cam.y-sh/(2*scale);return{x:clamp(xx,0,W),y:clamp(yy,0,H)}}
function drawRect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function renderGround(){drawRect(0,0,W,H,'#557e55');for(let yy=0;yy<H;yy+=30)for(let xx=0;xx<W;xx+=30){const v=(Math.imul(xx+193,733)+Math.imul(yy+29,571))%9;if(v===0)drawRect(xx+7,yy+14,18,5,'#4b754c');else if(v===1)drawRect(xx+6,yy+18,4,9,'#8ba668');else if(v===2)drawRect(xx+19,yy+6,5,6,'#759661')}
 // stone paths
 drawRect(0,318,960,78,'#9a8a64');drawRect(462,86,81,514,'#a49872');drawRect(135,268,760,54,'#aa9975');drawRect(115,383,64,217,'#8c8b66');drawRect(663,380,66,220,'#a99b78');for(let y=310;y<405;y+=15)for(let x=0;x<W;x+=32)drawRect(x+(y%3)*7,y+3,27,1,'#827957');for(let x=454;x<553;x+=17)for(let y=94;y<600;y+=29)drawRect(x,y+((x%3)*4),1,20,'#887e5c');
 // flowerbeds and trees
 for(const [x,y] of [[30,220],[44,460],[256,110],[816,320],[900,310],[870,562],[303,576],[745,568],[930,100],[45,96],[310,270]])tree(x,y);
 for(const [x,y] of [[306,397],[318,410],[789,375],[797,402],[262,484],[64,370],[902,412]]){drawRect(x,y,3,3,'#f0db9a');drawRect(x+6,y-4,3,3,'#f1a4ad')}
 // farms
 drawRect(35,431,185,128,'#72663e');for(let y=441;y<555;y+=17){drawRect(43,y,169,8,'#8b7449');for(let x=50;x<205;x+=18){drawRect(x,y-5,3,12,'#c9b95b');drawRect(x+5,y-8,3,9,'#e4d071')}}
 // houses and buildings
 house(48,115,192,153,'#867b83','#a86955','왕궁',true);house(300,123,157,111,'#93644c','#bd8a52','여관',false);house(589,98,174,123,'#8d6f51','#bc754d','시장',false);house(777,115,135,115,'#837b65','#b48c68','주택',false);house(276,441,170,99,'#a28a6f','#ae785e','민가',false);house(614,449,172,112,'#7e7870','#976e5e','대장간',false);
 // fountain center
 ctx.fillStyle='#626f6b';ctx.beginPath();ctx.ellipse(505,349,47,26,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8bbcc3';ctx.beginPath();ctx.ellipse(505,344,35,17,0,0,Math.PI*2);ctx.fill();drawRect(501,318,8,27,'#c4bfa0');drawRect(491,327,28,7,'#ddd3a6');drawRect(499,312,12,6,'#e9ddad');
 // stalls
 stall(573,260,'#a94e42');stall(663,268,'#6b72a7');stall(740,269,'#ad8654');
 // borders
 drawRect(0,0,W,20,'#233d34');drawRect(0,0,18,H,'#2b4b3a');drawRect(W-18,0,18,H,'#2b4b3a');}
function tree(x,y){drawRect(x-2,y+9,13,20,'#5f4a32');drawRect(x-22,y-10,52,26,'#345b3d');drawRect(x-12,y-27,32,19,'#466f42');drawRect(x-15,y-15,38,19,'#3b6745');drawRect(x-10,y-22,18,6,'#729250');}
function house(x,y,w,h,wall,roof,label,castle){drawRect(x+5,y+17,w,h,'#344a39');drawRect(x,y,w,h-12,wall);drawRect(x-11,y-18,w+22,46,'#443f41');drawRect(x-6,y-18,w+12,37,roof);for(let a=0;a<w-20;a+=25)drawRect(x+a+6,y-14,20,7,roof);drawRect(x+Math.floor(w/2)-12,y+h-54,24,42,'#42342b');drawRect(x+Math.floor(w/2)-9,y+h-51,18,40,'#684a37');drawRect(x+Math.floor(w/2)+5,y+h-31,3,3,'#ebd5a7');for(let a=0;a<2;a++)drawRect(x+16+a*(w-58),y+45,28,23,'#342f31');for(let a=0;a<2;a++)drawRect(x+20+a*(w-58),y+49,20,15,'#8bb8b4');if(castle){drawRect(x-18,y-34,42,81,'#8c8a80');drawRect(x+w-23,y-34,42,81,'#8c8a80');drawRect(x-22,y-44,50,17,'#605b6c');drawRect(x+w-27,y-44,50,17,'#605b6c');for(let a=0;a<4;a++){drawRect(x-24+a*15,y-55,10,15,'#928f7f');drawRect(x+w-26+a*15,y-55,10,15,'#928f7f')}drawRect(x+w/2-3,y-25,5,36,'#e7c474');drawRect(x+w/2+2,y-23,22,12,'#a94d42')}drawRect(x+5,y+h-8,w-10,8,'#494a39');ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillStyle='#19211c';ctx.fillText(label,x+w/2+1,y+h+23);ctx.fillStyle='#ffedb7';ctx.fillText(label,x+w/2,y+h+22)}
function stall(x,y,c){drawRect(x+5,y+10,62,34,'#705840');drawRect(x+2,y-3,69,19,c);for(let i=0;i<5;i++)drawRect(x+4+i*14,y-3,7,19,'#ebd2a7');drawRect(x+4,y+21,65,6,'#8c7551')}
function drawCharacter(n,now){if(!n.alive)return;const x=Math.round(n.x),y=Math.round(n.y),select=(n===selected);if(select){ctx.strokeStyle='#ffe7a5';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y+7,20,9,0,0,Math.PI*2);ctx.stroke()}if(n===player){ctx.strokeStyle='#fff4c0';ctx.lineWidth=2;ctx.strokeRect(x-14,y-28,28,34)}drawRect(x-9,y+6,18,5,'#23433380');const bob=Math.round(Math.sin(now/160+n.id)*1.4),c=colors[n.role]||'#e2c590';drawRect(x-8,y-9+bob,16,19,c);drawRect(x-11,y-3+bob,3,12,'#dfaa7c');drawRect(x+8,y-3+bob,3,12,'#dfaa7c');drawRect(x-7,y+10+bob,5,7,'#3e3c3f');drawRect(x+2,y+10+bob,5,7,'#3e3c3f');drawRect(x-8,y-24+bob,16,16,'#eac4a0');drawRect(x-9,y-26+bob,18,6,n.role==='왕'?'#dcb654':n.role==='도적'?'#453b46':'#5d4b3a');if(n.role==='왕'){drawRect(x-7,y-31+bob,4,9,'#e7be63');drawRect(x,y-32+bob,4,9,'#e7be63');drawRect(x+6,y-31+bob,4,9,'#e7be63')}if(n.role==='경비병'){drawRect(x-12,y-12+bob,24,5,'#667c96')}if(n.role==='도적')drawRect(x-9,y-20+bob,18,8,'#423d43');drawRect(x-4,y-18+bob,2,2,'#423733');drawRect(x+3,y-18+bob,2,2,'#423733');if(n===player){ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillStyle='#102920';ctx.fillText('▼',x+1,y-36);ctx.fillStyle='#ffe29e';ctx.fillText('▼',x,y-37)}if(n.hp<45&&n!==player){drawRect(x-13,y-35,26,4,'#402724');drawRect(x-13,y-35,Math.max(0,26*n.hp/100),4,'#d97c65')}if(n===selected||dist(n,player)<52){ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillStyle='#18261c';ctx.fillText(n.name.replace(' (나)',''),x+1,y-39);ctx.fillStyle='#fff6d6';ctx.fillText(n.name.replace(' (나)',''),x,y-40)}}
function render(now){const r=cvs.getBoundingClientRect();if(Math.abs(r.width-sw)>1||Math.abs(r.height-sh)>1)resize();ctx.setTransform(px,0,0,px,0,0);drawRect(0,0,sw,sh,'#1a3229');calcCamera();ctx.save();ctx.translate(sw/2,sh/2);ctx.scale(scale,scale);ctx.translate(-cam.x,-cam.y);renderGround();for(const item of bags){if(item.money<=0)continue;drawRect(item.x-9,item.y-4,18,13,'#866635');drawRect(item.x-5,item.y-8,10,5,'#d9b769');drawRect(item.x+3,item.y-4,3,5,'#fbe2a7');ctx.font='12px system-ui';ctx.fillStyle='#ffeca4';ctx.textAlign='center';ctx.fillText('✦',item.x,item.y-10)}for(const n of active().sort((a,b)=>a.y-b.y))drawCharacter(n,now);
 for(const b of bubbles.filter(b=>b.until>now)){if(!b.n?.alive)continue;const x=b.n.x,y=b.n.y-66;ctx.font='bold 13px system-ui';const w=clamp(ctx.measureText(b.text).width+20,35,170);drawRect(x-w/2,y-16,w,25,'#26382f');ctx.strokeStyle='#edda9b';ctx.lineWidth=1;ctx.strokeRect(x-w/2,y-16,w,25);ctx.textAlign='center';ctx.fillStyle='#fff4d2';ctx.fillText(b.text.slice(0,14),x,y+1)}for(const p of particles.filter(p=>p.until>now)){const v=1-(p.until-now)/1850;ctx.font='bold 18px system-ui';ctx.fillStyle=p.color;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y-27-v*28)}ctx.restore()}
function frame(now){const dt=Math.min(.05,(now-last)/1000||.016);last=now;if(!paused&&player?.alive){playerMove(dt);npcMove(dt);tickLag+=dt*1000*speed;while(tickLag>=750&&player.alive){worldTick();tickLag-=750}uiTime++;if(uiTime%24===0)refresh()}if(toastUntil&&now>toastUntil){$('toast').classList.add('gone');toastUntil=0}particles=particles.filter(p=>p.until>now);bubbles=bubbles.filter(b=>b.until>now);render(now);requestAnimationFrame(frame)}
cvs.addEventListener('pointerdown',e=>{if(paused)return;const p=getWorldPos(e);const neighbors=active().filter(n=>n!==player&&dist(n,p)<23).sort((a,b)=>dist(a,p)-dist(b,p));if(neighbors.length){select(neighbors[0]);return}const bag=bags.find(b=>b.money>0&&dist(b,p)<26);if(bag){if(dist(player,bag)<50){player.gold+=bag.money;spark(player.x,player.y,'+'+bag.money+'G');addLog(`${bag.money}G가 든 돈주머니를 주웠습니다.`);bag.money=0;refresh()}else{nav={x:bag.x,y:bag.y,bag};announce('돈주머니 쪽으로 이동합니다.')}return}nav={x:p.x,y:p.y};queued=null;});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();keys.add(e.key.length===1?e.key.toLowerCase():e.key);if(e.key==='Escape'&&!$('overlay').classList.contains('gone')){hideModal();paused=false}});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>keys.clear());
$('actions').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(b)doAction(b.dataset.act)});
$('nearby').onclick=()=>{const nearest=active().filter(n=>n!==player).sort((a,b)=>dist(a,player)-dist(b,player))[0];if(nearest)select(nearest)};$('focus').onclick=()=>{cam.x=player.x;cam.y=player.y;nav=null;announce('현재 위치로 돌아왔습니다.')};$('eventGo').onclick=()=>{const n=ev&&targetById(ev.id);if(n){select(n);nav={targetId:n.id};announce('사건 현장으로 이동합니다.')}else announce('진행 중인 사건이 없습니다.')};$('pause').onclick=()=>{paused=!paused;refresh()};$('speed').onclick=()=>{speed=speed===1?3:1;refresh()};$('history').onclick=inspect;$('info').onclick=help;$('newWorld').onclick=()=>showModal('정말 새로운 세계로 갈까요?',`<p>지금까지의 세계와 인물은 사라집니다. 기존 세계에서 계속 살고 싶다면 돌아가기를 누르세요.</p>`,[{label:'새 왕국 생성',action:()=>{hideModal();worldN++;genWorld((Date.now()+worldN*7127)>>>0)}},{label:'현재 세계 유지',action:()=>{hideModal();paused=false}}]);
window.__gameDebug={step(n=1){for(let i=0;i<n;i++){worldTick();npcMove(.25)}refresh();return this.summary()},summary(){return{day:world.day,tick:world.tick,alive:active().length,deaths:world.deaths,migrants:world.migrants,crimes:world.crimes,king:targetById(world.king)?.name||null,player:player.name,playerHp:player.hp,playerGold:player.gold,seed}},getNpcs(){return world.npcs.map(n=>({id:n.id,name:n.name,role:n.role,goal:n.goal,alive:n.alive,traits:n.traits}))},choose(n){const x=active().find(p=>p.name.includes(n)&&p!==player);if(x)select(x)},action(a){doAction(a)},killPlayer(){die(player,null)}};
resize();new ResizeObserver(resize).observe($('world'));genWorld((Date.now()%2147483647)>>>0);requestAnimationFrame(frame);
})();
