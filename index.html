function setView(mode){mapMode=mode==='map';$('app').classList.toggle('mapMode',mapMode);$('mapToggle').textContent=mapMode?'직책표':'지도';$('mapToggle').classList.toggle('active',mapMode);if(!mapMode)updateRoster()}

function updateUI(){let alive=living();$('mDay').textContent=`${W.day}일 ${String(W.hour).padStart(2,'0')}시`;$('mPop').textContent=alive.length+'명';$('mKing').textContent=king()?.name.split(' ')[0]||'공석';$('mDeaths').textContent=`${W.deaths} / ${W.arrivals}`;$('mOrder').textContent='치안 '+Math.round(W.order)+' · 굶주림 '+(W.hungry||0);$('worldName').textContent=W.name;$('worldName').nextElementSibling.textContent=W.culture>68?'탐욕과 사기가 만연한 사회':W.culture<32?'정직과 신뢰를 중시하는 사회':'인물마다 다른 욕망이 충돌하는 사회';$('season').textContent=paused?'시뮬레이션 정지':`${speed}배속 · 자율 시뮬레이션`;$('liveText').textContent=paused?'일시 정지':'자동 진행 중';$('liveDot').classList.toggle('off',paused);$('status').textContent=following?`추적: ${byId(following)?.name||'종료'}`:'관찰자 · 개입 필요 없음';const list=$('eventList');list.replaceChildren();for(const e of W.events.slice(0,3)){let div=document.createElement('div');div.className='event '+e.type;let sym=document.createElement('span');sym.className='symbol';sym.textContent=({violent:'×',political:'♛',scam:'?',migration:'+',justice:'!',trade:'◈',world:'•'})[e.type]||'•';let t=document.createElement('div');t.className='et';t.textContent=e.description;let small=document.createElement('small');small.textContent=`${e.day}일 ${String(e.hour).padStart(2,'0')}시`;t.append(small);div.append(sym,t);div.addEventListener('click',()=>{if(e.id)selectNPC(e.id)});list.append(div)}if(selected)updatePanel();if(!mapMode)updateRoster()}
function updatePanel(){let n=byId(selected);if(!n)return;let personality=Object.entries(n.p).sort((a,b)=>b[1]-a[1]);const traitLabels={greed:'탐욕',honesty:'정직',fear:'겁',ambition:'야망',empathy:'공감',suspicion:'의심',aggression:'공격성',loyalty:'충성',cunning:'교활함'};$('pName').textContent=n.name+(n.alive?'':' (사망)');$('pRole').textContent=`${n.role} · ${n.age}세 · 소지금 ${n.gold}G · 체력 ${Math.max(0,Math.round(n.hp))} · 허기 ${Math.round(n.hunger)}`;$('pTags').replaceChildren();for(const item of [`목표: ${n.goal}`, ...personality.slice(0,3).map(([k,v])=>traitLabels[k]+' '+Math.round(v))]){let s=document.createElement('span');s.className='tag';s.textContent=item;$('pTags').append(s)}$('pDesc').textContent=`사기 ${n.scamCount}회 · 피해 ${n.victimCount}회 · 살해 ${n.kills}명 · 스트레스 ${Math.round(n.stress)}. 거처 ${n.shelter||'미정'}. 전일 수입 ${n.incomeYesterday||0}G·지출 ${n.expensesYesterday||0}G. ${n.role==='왕'?'신하 '+familySupport(n).advisors.length+'명 · 충성하는 조력자 '+familySupport(n).loyal.length+'명. ':n.role==='치안대'?'치안대 지휘 아래 신고 사건을 수사한다. ':''}현재 ${sites[n.loc].name} 주변에서 생활한다.`;let entries=Object.entries(n.known).filter(([,mem])=>mem.fraud||mem.theft||mem.assault).slice(0,3);$('pMemory').textContent=entries.length?`기억: ${entries.map(([id,m])=>{let x=byId(+id);return `${x?.name||'누군가'}에게 ${m.fraud?'사기 '+m.fraud+'회':m.theft?'도난 '+m.theft+'회':'공격 '+m.assault+'회'} 경험`}).join(' / ')}`:'피해 경험이 알려진 상대는 아직 없다.';$('pFollow').textContent=following===n.id?'추적 해제':'이 사람 추적';}
function selectNPC(id){let n=byId(id);if(!n)return;selected=id;$('panel').classList.add('open');updatePanel()}
function screenToWorld(px,py){let r=c.getBoundingClientRect();return{x:(px-r.left)/r.width*960,y:(py-r.top)/r.height*600}}
function clicked(e){const p=screenToWorld(e.clientX,e.clientY);let best=null,d=9999;for(const n of living()){const dist=Math.hypot(n.x-p.x,n.y-p.y);if(dist<d){d=dist;best=n}}if(best&&d<55)selectNPC(best.id);else{$('panel').classList.remove('open');selected=null}}
function animate(now){if(!lastFrame)lastFrame=now;const dt=clamp(now-lastFrame,0,150);lastFrame=now;if(!paused){acc+=dt*speed;let loops=0;while(acc>=600&&loops<20){tick();acc-=600;loops++}if(loops)updateUI()}if(W.notice&&now<W.notice.until){$('toast').textContent=W.notice.text;$('toast').classList.add('show')}else{$('toast').classList.remove('show')}renderWorld();requestAnimationFrame(animate)}
function newWorld(){const seed=(Math.floor(Math.random()*0xFFFFFFFF))>>>0;createWorld(seed);saveWorld();notify('새 왕국이 생성되었습니다. 모든 주민이 자율적으로 살아갑니다.')}
document.querySelector('.playarea').appendChild($('panel'));makeRosterControls();$('mapToggle').onclick=()=>setView(mapMode?'roster':'map');$('rosterPrev').onclick=()=>{rosterPage=Math.max(0,rosterPage-1);updateRoster()};$('rosterNext').onclick=()=>{rosterPage++;updateRoster()};window.addEventListener('resize',()=>{if(!mapMode)updateRoster()});c.addEventListener('click',clicked);$('pClose').onclick=()=>{$('panel').classList.remove('open');selected=null};$('pFollow').onclick=()=>{following=following===selected?null:selected;updatePanel();updateUI()};$('pauseBtn').onclick=()=>{paused=!paused;$('pauseBtn').textContent=paused?'계속 진행':'일시정지';updateUI()};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b));updateUI()});$('newWorld').onclick=newWorld;
if(!loadWorld())createWorld((Date.now()>>>0)+32719);setView('roster');window.addEventListener('pagehide',saveWorld);requestAnimationFrame(animate);
window.__EVERWORLD__={getState:()=>({culture:W.culture,day:W.day,hour:W.hour,pop:living().length,total:W.people.length,deaths:W.deaths,arrivals:W.arrivals,crowns:W.crowns,foreignChanges:W.foreignChanges,king:king()?.id||null,events:W.events.length,seats:W.seats.map(seat=>({id:seat.id,title:seat.title,role:seat.role,sector:seat.sector,holder:seat.holder,vacantSince:seat.vacantSince,lastHolder:seat.lastHolder,lastReason:seat.lastReason})),workTotal:W.workTotal,counts:{...W.actionCounts},money:living().reduce((s,n)=>s+n.gold,0),seed:W.seed}),advance:(hours)=>{for(let i=0;i<hours;i++)tick();updateUI();return window.__EVERWORLD__.getState()},reset:(seed)=>createWorld(seed),getNPCs:()=>W.people.map(n=>({id:n.id,role:n.role,goal:n.goal,alive:n.alive,known:n.known,gold:n.gold,x:n.x,y:n.y,trust:n.trust})),pause:()=>{paused=true;updateUI()}};
})();
</script></body></html>
